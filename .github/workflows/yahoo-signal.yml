name: Update Yahoo Signal
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - run: python webapp/update_signal.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webapp/data/signal.json
          git diff --cached --quiet || git commit -m "Update Yahoo trading signal"
          git push
