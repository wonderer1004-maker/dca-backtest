name: 자동매매 코드 점검

on:
  push:
    branches: [condition-backtest]
    paths:
      - "momentum_autotrade/*.py"
      - ".github/workflows/autotrade-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r momentum_autotrade/requirements_scan.txt
      - name: 흐름 테스트 + 실제 데이터로 스캔 (200종목)
        working-directory: momentum_autotrade
        run: |
          {
            echo "### test_flow.py"; python test_flow.py 2>&1 | grep -vE '^\[[0-9]{2}:' ;
            echo; echo "### scan.py --limit 200"; python scan.py --limit 200 2>&1 ;
            echo; echo "### signals"; cat data/signals_*.json ;
          } > ci_check.log 2>&1 || true
          cat ci_check.log
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f momentum_autotrade/ci_check.log
          git commit -m "자동매매 점검 결과 [skip ci]" || true
          git push
